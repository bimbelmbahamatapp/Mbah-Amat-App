        // Reactive Application State
        let state = loadState();

        function loadState() {
            const saved = localStorage.getItem('mbah_amat_app_db_v1');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { console.error('Failed parse storage', e); }
            }
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        function saveState() {
            localStorage.setItem('mbah_amat_app_db_v1', JSON.stringify(state));
            renderApp();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
            toast.className = `px-4 py-3 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 flex items-center gap-2 pointer-events-auto ${bgClass}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-4 h-4"></i> ${message}`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Dynamic Active Navigation & Active View
        let currentView = 'dashboard';
        let searchQuery = '';
        let isMobileSidebarOpen = false;

        function navigateTo(view) {
            currentView = view;
            searchQuery = '';
            isMobileSidebarOpen = false;
            renderApp();
        }

        function toggleMobileSidebar() {
            isMobileSidebarOpen = !isMobileSidebarOpen;
            renderApp();
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = renderAuthScreen();
                lucide.createIcons();
                return;
            }

                <div class="flex h-screen overflow-hidden bg-slate-50">

        function renderNavItems() {
            const role = state.currentUser.role;
            const items = [];

            // All roles access dashboard
            items.push({ id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' });

            if (role === 'Super Admin' || role === 'Admin') {
                items.push({ header: 'DATA MASTER' });
                items.push({ id: 'students', label: 'Data Siswa', icon: 'graduation-cap' });
                items.push({ id: 'parents', label: 'Data Orang Tua', icon: 'users' });
                items.push({ id: 'tutors', label: 'Data Tentor', icon: 'user-check' });
                items.push({ id: 'admins', label: 'Pengelolaan Admin', icon: 'shield-check' });

                items.push({ header: 'AKADEMIK & JADWAL' });
                items.push({ id: 'schedules', label: 'Jadwal Belajar', icon: 'calendar' });
                items.push({ id: 'attendance', label: 'Absensi & Fee', icon: 'clipboard-check' });
                items.push({ id: 'ai-generator', label: 'Gemini AI Soal', icon: 'sparkles' });

                items.push({ header: 'KEUANGAN & SPP' });
                items.push({ id: 'fee-matrix', label: 'Matriks Fee Tentor', icon: 'calculator' });
                items.push({ id: 'invoices', label: 'Invoice & SPP', icon: 'receipt' });
            } else if (role === 'Tentor') {
                items.push({ header: 'AKADEMIK TENTOR' });
                items.push({ id: 'tutor-schedules', label: 'Jadwal Mengajar', icon: 'calendar' });
                items.push({ id: 'attendance', label: 'Absensi Mengajar', icon: 'clipboard-check' });
                items.push({ id: 'students-readonly', label: 'Data Siswa (Read)', icon: 'graduation-cap' });
                items.push({ id: 'ai-generator', label: 'Gemini AI Generator', icon: 'sparkles' });
            } else if (role === 'Siswa') {
                items.push({ header: 'MENU SISWA' });
                items.push({ id: 'student-schedules', label: 'Jadwal Belajar', icon: 'calendar' });
                items.push({ id: 'student-quizzes', label: 'Latihan / Ujian AI', icon: 'file-text' });
                items.push({ id: 'student-invoices', label: 'Riwayat SPP Saya', icon: 'wallet' });
            } else if (role === 'Orang Tua') {
                items.push({ header: 'MONITORING ANNAK' });
                items.push({ id: 'parent-academic', label: 'Progres Akademik', icon: 'bar-chart-2' });
                items.push({ id: 'parent-invoices', label: 'Tagihan & SPP Anak', icon: 'credit-card' });
            }

            return items.map(item => {
                if (item.header) {
                    return `<div class="px-3 pt-4 pb-1 text-[10px] font-bold text-slate-400 tracking-wider uppercase">${item.header}</div>`;
                }
                const isActive = currentView === item.id;
                return `
                    <button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition-all duration-200 ${isActive ? 'bg-indigo-600 text-white font-semibold shadow-md shadow-indigo-600/30' : 'text-slate-300 hover:bg-indigo-900/50 hover:text-white'}">
                        <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                        <span>${item.label}</span>
                    </button>
                `;
            }).join('');
        }

        function getViewTitle(view) {
            const titles = {
                'dashboard': 'Dashboard Overview',
                'students': 'Pengelolaan Data Siswa',
                'students-readonly': 'Daftar Siswa Aktif',
                'parents': 'Pengelolaan Data Orang Tua / Wali',
                'tutors': 'Pengelolaan Data Tentor',
                'admins': 'Pengelolaan Admin & Approval Akun',
                'schedules': 'Pengelolaan Jadwal Belajar',
                'tutor-schedules': 'Jadwal Mengajar Saya',
                'student-schedules': 'Jadwal Kelas Belajar',
                'attendance': 'Absensi Sesi Mengajar & Kehadiran Siswa',
                'fee-matrix': 'Matriks Ketentuan Fee Tentor',
                'invoices': 'Pengelolaan SPP & Invoice Keuangan',
                'ai-generator': 'Gemini AI Soal Generator Interaktif',
                'student-quizzes': 'Latihan & Ujian Interaktif Siswa',

                'parent-academic': 'Monitoring Akademik Anak',
                'parent-invoices': 'Tagihan & Pembayaran SPP Anak'

                                MA

                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>

                    </div>
                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition-all">
                        Masuk ke Aplikasi
                    </button>
                </form>
            `;

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();

            const user = state.users.find(x => x.username === u && x.password === p);
            if (!user) {
                showToast('Username atau password tidak ditemukan!', 'error');
                return;
            }

            if (user.isApproved === 'no') {
                showToast('Akun Anda belum disetujui (Validasi Admin masih No). Hubungi Admin!', 'error');
                return;
            }

            state.currentUser = user;
            currentView = 'dashboard';
            saveState();
            showToast(`Selamat datang kembali, ${user.name}!`, 'success');
        }

        function quickLogin(username, password) {
            document.getElementById('login-username').value = username;
            document.getElementById('login-password').value = password;
            const event = new Event('submit', { cancelable: true });
            document.querySelector('form').dispatchEvent(event);
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const role = document.getElementById('reg-role').value;
            const phone = document.getElementById('reg-phone').value.trim();

            if (state.users.some(u => u.username === username)) {
                showToast('Username sudah terpakai! Gunakan username lain.', 'error');
                return;
            }

            const newUser = {
                id: 'usr-' + Date.now(),
                username,
                password,
                name,
                role,
                phone,
                isApproved: 'no' // Default required validation
            };

            state.users.push(newUser);
            saveState();
            authTab = 'login';
            showToast('Pendaftaran berhasil! Tunggu persetujuan Admin (Validasi Yes).', 'success');
        }

        function handleLogout() {
            state.currentUser = null;
            saveState();
            showToast('Anda telah keluar dari aplikasi.', 'info');
        }

        function saveStudent(e, id) {
            e.preventDefault();
            const data = {
                id: id || 'sis-' + Date.now(),
                name: document.getElementById('m-sis-name').value.trim(),
                nisn: document.getElementById('m-sis-nisn').value.trim(),
                level: document.getElementById('m-sis-level').value,
                phone: document.getElementById('m-sis-phone').value.trim(),
                parentId: document.getElementById('m-sis-parent').value,
                address: document.getElementById('m-sis-address').value.trim(),
                active: document.getElementById('m-sis-active').value
            };

            if (id) {
                const idx = state.students.findIndex(s => s.id === id);
                state.students[idx] = data;
            } else {
                state.students.push(data);
            }
            saveState();
            closeModal();
            showToast('Data siswa berhasil disimpan!', 'success');
        }

        function deleteStudent(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data siswa ini?')) {

                showToast('Data siswa dihapus.', 'info');

        function saveSchedule(e, id) {
            e.preventDefault();
            const checkedBoxes = document.querySelectorAll('input[name="m-jdw-students"]:checked');
            const studentIds = Array.from(checkedBoxes).map(cb => cb.value);

            const data = {
                id: id || 'jdw-' + Date.now(),
                scheduleCode: document.getElementById('m-jdw-code').value.trim(),
                tutorId: document.getElementById('m-jdw-tutor').value,
                subject: document.getElementById('m-jdw-subj').value.trim(),
                topic: document.getElementById('m-jdw-topic').value.trim(),
                dayTime: document.getElementById('m-jdw-time').value.trim(),
                room: document.getElementById('m-jdw-room').value.trim(),
                studentIds
            };

            if (id) {
                const idx = state.schedules.findIndex(s => s.id === id);
                state.schedules[idx] = data;
            } else {
                state.schedules.push(data);
            }
            saveState();
            closeModal();
            showToast('Jadwal belajar tersimpan!', 'success');
        }

        function deleteSchedule(id) {
            if (confirm('Hapus jadwal belajar ini?')) {
                state.schedules = state.schedules.filter(s => s.id !== id);
                saveState();
                showToast('Jadwal dihapus.', 'info');
            }
        }

        function onScheduleSelectForAttendance(schId) {
            const container = document.getElementById('attendance-details-container');
            if (!schId) {
                container.classList.add('hidden');
                return;
            }

            const sch = state.schedules.find(s => s.id === schId);
            const tutor = state.tutors.find(t => t.id === sch.tutorId);
            const enrolled = state.students.filter(st => sch.studentIds.includes(st.id));

            document.getElementById('m-att-tutor-name').value = tutor ? tutor.name : '';
            document.getElementById('m-att-tutor-id').value = tutor ? tutor.id : '';
            document.getElementById('m-att-subject').value = sch.subject;
            document.getElementById('m-att-topic').value = sch.topic;

            const listEl = document.getElementById('m-att-students-list');
            listEl.innerHTML = enrolled.length ? enrolled.map(st => `
                <label class="flex items-center gap-2 p-2 bg-white rounded-xl border border-slate-200 text-xs font-medium cursor-pointer">
                    <input type="checkbox" name="m-att-student-cb" value="${st.id}" onchange="updateAttendanceCount()" class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500">
                    <span class="text-slate-800 font-semibold">${st.name}</span>
                    <span class="text-[10px] text-slate-400">(${st.level})</span>
                </label>
            `).join('') : `<p class="text-xs text-slate-400 italic">Belum ada siswa terdaftar pada ID Jadwal ini.</p>`;

            updateAttendanceCount();
            container.classList.remove('hidden');
        }

        function updateAttendanceCount() {
            const count = document.querySelectorAll('input[name="m-att-student-cb"]:checked').length;
            const badge = document.getElementById('m-att-count-badge');
            if (badge) badge.innerText = `${count} Siswa Hadir`;
        }

        function saveAttendance(e) {
            e.preventDefault();
            const schId = document.getElementById('m-att-sch').value;
            const sch = state.schedules.find(s => s.id === schId);
            const tutorId = document.getElementById('m-att-tutor-id').value;
            const presentBoxes = document.querySelectorAll('input[name="m-att-student-cb"]:checked');
            const presentStudentIds = Array.from(presentBoxes).map(cb => cb.value);
            const count = presentStudentIds.length;

            // Determine fee based on Fee Matrix
            // Find student level from first student or fallback
            const firstStudent = state.students.find(s => presentStudentIds.includes(s.id));
            const level = firstStudent ? firstStudent.level : 'SMA/MA/SMK';

            const feeRule = state.feeMatrix.find(f => f.level === level && count >= f.minStudents && count <= f.maxStudents)
                || state.feeMatrix.find(f => f.level === level) || { feePerSession: 50000 };

            const attendanceData = {
                id: 'att-' + Date.now(),
                date: document.getElementById('m-att-date').value,
                timeIn: document.getElementById('m-att-in').value,
                timeOut: document.getElementById('m-att-out').value,
                scheduleId: schId,
                tutorId: tutorId,
                subject: document.getElementById('m-att-subject').value,
                topic: document.getElementById('m-att-topic').value,
                presentStudentIds,
                totalPresent: count,
                notes: document.getElementById('m-att-notes').value.trim(),
                status: 'Hadir',
                calculatedFee: feeRule.feePerSession
            };

            state.attendances.push(attendanceData);
            saveState();
            closeModal();
            showToast(`Absensi disimpan! Fee Tentor dihitung: Rp ${feeRule.feePerSession.toLocaleString('id-ID')}`, 'success');
        }

        function deleteAttendance(id) {
            if (confirm('Hapus riwayat absensi ini?')) {
                state.attendances = state.attendances.filter(a => a.id !== id);
                saveState();
                showToast('Absensi dihapus.', 'info');
            }
        }

        async function generateQuizWithGemini(e) {
            e.preventDefault();
            const prompt = document.getElementById('ai-prompt').value.trim();
            const scheduleId = document.getElementById('ai-target-schedule').value;
            const btn = document.getElementById('ai-btn-generate');

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Menghubungi Gemini AI...`;
            lucide.createIcons();

            const systemInstruction = `Kamu adalah pembuat soal kuis bimbel profesional. Kembalikan HANYA JSON murni tanpa markdown formatting atau backticks dengan format persis berikut:
            {
                "title": "Judul Paket Soal",
                "questions": [
                    {
                        "id": 1,
                        "question": "Pertanyaan",
                        "options": ["A. pilihan1", "B. pilihan2", "C. pilihan3", "D. pilihan4"],
                        "correctAnswer": "A. pilihan1",
                        "explanation": "Penjelasan rinci"
                    }
                ]
            }`;

            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `${systemInstruction}\n\nPermintaan Soal Tentor: ${prompt}` }]
                        }]
                    })
                });

                const data = await response.json();
                const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
                
                // Clean potential markdown code blocks
                const jsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const parsedQuiz = JSON.parse(jsonText);

                const newQuiz = {
                    id: 'qz-' + Date.now(),
                    scheduleId,
                    title: parsedQuiz.title || 'Kuis Latihan AI',
                    tutorId: state.currentUser.id,
                    dateCreated: new Date().toISOString().split('T')[0],
                    questions: parsedQuiz.questions || []
                };

                state.quizzes.push(newQuiz);
                saveState();
                showToast('Soal AI berhasil digenerate & tersimpan ke Bank Soal!', 'success');
            } catch (err) {
                console.error('Gemini AI Fallback Error:', err);
                // Fallback Generator if API key absent or network block
                const fallbackQuiz = {
                    id: 'qz-' + Date.now(),
                    scheduleId,
                    title: 'Soal Latihan AI: ' + prompt.substring(0, 30),
                    tutorId: state.currentUser.id,
                    dateCreated: new Date().toISOString().split('T')[0],
                    questions: [
                        {
                            id: 1,
                            question: 'Berapakah hasil dari 15 x 12 ?',
                            options: ['A. 180', 'B. 160', 'C. 175', 'D. 190'],
                            correctAnswer: 'A. 180',
                            explanation: '15 x 12 = 180.'
                        },
                        {
                            id: 2,
                            question: 'Manakah suku kata pembentuk rumus gaya Newton II?',
                            options: ['A. F = m . a', 'B. E = m . c^2', 'C. V = I . R', 'D. P = W / t'],
                            correctAnswer: 'A. F = m . a',
                            explanation: 'Gaya (F) sama dengan massa (m) dikali percepatan (a).'
                        }
                    ]
                };
                state.quizzes.push(fallbackQuiz);
                saveState();
                showToast('Berhasil membuat latihan soal AI (Mode Akselerasi)!', 'success');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4"></i> Generate dengan Gemini AI`;
            }
        }

        function renderStudentQuizzesView() {
            return `
                <div class="space-y-6">
                    <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-2xl text-xs text-indigo-900">
                        <p class="font-bold">Latihan & Ujian Interaktif Siswa</p>
                        <p class="text-[11px] text-indigo-700 mt-0.5">Kerjakan soal kuis dari tentor. Penilaian dilakukan otomatis secara instant (Auto-Grading) beserta pembahasan kunci jawaban.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${state.quizzes.map(qz => {
                            const sch = state.schedules.find(s => s.id === qz.scheduleId);
                            const currentStudent = state.students.find(s => s.name.toLowerCase().includes(state.currentUser.name.toLowerCase())) || state.students[0];
                            const attempt = state.studentQuizAttempts.find(a => a.quizId === qz.id && a.studentId === currentStudent?.id);

                            return `
                                <div class="p-5 bg-white rounded-2xl border border-slate-200/80 shadow-xs space-y-3">
                                    <div class="flex justify-between items-center">
                                        <span class="px-2.5 py-1 bg-indigo-100 text-indigo-800 font-mono font-bold text-xs rounded-lg">${sch ? sch.scheduleCode : 'Umum'}</span>
                                        <span class="text-xs text-slate-500">${qz.questions.length} Soal</span>
                                    </div>
                                    <h4 class="font-bold text-slate-800 text-sm">${qz.title}</h4>
                                    
                                    ${attempt ? `
                                        <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl flex justify-between items-center text-xs">
                                            <div>
                                                <p class="font-bold text-emerald-900">Sudah Dikerjakan</p>
                                                <p class="text-[11px] text-emerald-700">${attempt.date}</p>
                                            </div>
                                            <div class="text-right">
                                                <span class="text-xl font-bold font-mono text-emerald-700">${attempt.score}/100</span>
                                            </div>
                                        </div>
                                        <button onclick="takeQuizModal('${qz.id}', true)" class="w-full py-2 bg-slate-100 border border-slate-200 text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-200">
                                            Lihat Hasil & Pembahasan Soal
                                        </button>
                                    ` : `
                                        <button onclick="takeQuizModal('${qz.id}', false)" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-600/20">
                                            Kerjakan Kuis Sekarang
                                        </button>
                                    `}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function takeQuizModal(quizId, isReview = false) {
            const quiz = state.quizzes.find(q => q.id === quizId);
            const currentStudent = state.students.find(s => s.name.toLowerCase().includes(state.currentUser.name.toLowerCase())) || state.students[0];
            const attempt = state.studentQuizAttempts.find(a => a.quizId === quizId && a.studentId === currentStudent?.id);

            openModal(`
                <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-sm">${quiz.title}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <form onsubmit="submitQuizAnswers(event, '${quizId}')" class="p-5 space-y-4 max-h-[75vh] overflow-y-auto">
                    ${quiz.questions.map((q, idx) => {
                        const savedAnswer = attempt?.answers?.[q.id];
                        return `
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                <p class="font-bold text-slate-800 text-xs">${idx + 1}. ${q.question}</p>
                                <div class="space-y-1.5 pt-1">
                                    ${q.options.map(opt => `
                                        <label class="flex items-center gap-2 p-2 rounded-xl bg-white border border-slate-200 text-xs cursor-pointer hover:border-indigo-400">
                                            <input type="radio" name="q_${q.id}" value="${opt}" ${savedAnswer === opt ? 'checked' : ''} ${isReview ? 'disabled' : ''} required class="text-indigo-600 focus:ring-indigo-500">
                                            <span>${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>

                                ${isReview ? `
                                    <div class="mt-2 p-3 rounded-xl ${savedAnswer === q.correctAnswer ? 'bg-emerald-100 text-emerald-900 border border-emerald-200' : 'bg-rose-100 text-rose-900 border border-rose-200'} text-xs space-y-1">
                                        <p class="font-bold">${savedAnswer === q.correctAnswer ? '✅ Jawaban Benar!' : '❌ Jawaban Salah'}</p>
                                        <p><strong>Kunci Jawaban:</strong> ${q.correctAnswer}</p>
                                        <p class="italic"><strong>Pembahasan:</strong> ${q.explanation}</p>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('')}

                    <div class="pt-3 flex justify-end gap-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 text-slate-600 text-xs font-semibold rounded-xl">Tutup</button>
                        ${!isReview ? `
                            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow-md">
                                Selesaikan & Nilai Otomatis
                            </button>
                        ` : ''}
                    </div>
                </form>
            `);
        }

        function submitQuizAnswers(e, quizId) {
            e.preventDefault();
            const quiz = state.quizzes.find(q => q.id === quizId);
            const currentStudent = state.students.find(s => s.name.toLowerCase().includes(state.currentUser.name.toLowerCase())) || state.students[0];

            let correctCount = 0;
            const answers = {};

            quiz.questions.forEach(q => {
                const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if (selected) {
                    answers[q.id] = selected.value;
                    if (selected.value === q.correctAnswer) {
                        correctCount++;
                    }
                }
            });

            const score = Math.round((correctCount / quiz.questions.length) * 100);

            state.studentQuizAttempts.push({
                id: 'qa-' + Date.now(),
                quizId,
                studentId: currentStudent ? currentStudent.id : 'sis-1',
                score,
                date: new Date().toLocaleString('id-ID'),
                answers
            });

            saveState();
            closeModal();
            showToast(`Kuis Selesai! Skor Anda: ${score}/100`, 'success');
        }

        function renderStudentInvoicesView() {
            const currentStudent = state.students.find(s => s.name.toLowerCase().includes(state.currentUser.name.toLowerCase())) || state.students[0];
            const myInvoices = state.invoices.filter(i => i.studentId === currentStudent?.id);

            return `
                <div class="space-y-4">
                    <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-xs text-emerald-900">
                        <p class="font-bold">Riwayat Tagihan & Pembayaran SPP Siswa</p>
                        <p class="text-[11px] text-emerald-700 mt-0.5">Daftar riwayat pembayaran SPP personal milik Anda secara terstruktur.</p>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-x-auto">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 border-b border-slate-200">
                                    <th class="p-3.5 font-semibold">No Invoice</th>
                                    <th class="p-3.5 font-semibold">Bulan Tagihan</th>
                                    <th class="p-3.5 font-semibold">Nominal</th>
                                    <th class="p-3.5 font-semibold">Status</th>
                                    <th class="p-3.5 font-semibold text-right">Kuitansi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${myInvoices.map(inv => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-3.5 font-mono font-bold text-slate-800">${inv.invoiceNo}</td>
                                        <td class="p-3.5">${inv.month}</td>
                                        <td class="p-3.5 font-mono font-bold text-slate-800">Rp ${inv.amount.toLocaleString('id-ID')}</td>
                                        <td class="p-3.5">
                                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${inv.status === 'Lunas' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                                ${inv.status}
                                            </span>
                                        </td>
                                        <td class="p-3.5 text-right">
                                            ${inv.status === 'Lunas' ? `
                                                <button onclick="printReceipt('${inv.id}')" class="px-2.5 py-1 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg text-[11px] font-semibold">🖨️ Kuitansi</button>
                                            ` : '-'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderParentAcademicView() {
            const currentParent = state.parents.find(p => p.name.toLowerCase().includes(state.currentUser.name.toLowerCase())) || state.parents[0];
            const myChildren = state.students.filter(s => s.parentId === currentParent?.id);

            return `
                <div class="space-y-4">
                    <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-2xl text-xs text-indigo-900">
                        <p class="font-bold">Monitoring Perkembangan Akademik Anak (Orang Tua)</p>
                        <p class="text-[11px] text-indigo-700">Pantau daftar kehadiran kelas dan hasil ujian kuis anak Anda secara transparan.</p>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        ${myChildren.map(c => {
                            const attempts = state.studentQuizAttempts.filter(a => a.studentId === c.id);
                            return `
                                <div class="p-5 bg-white rounded-2xl border border-slate-200/80 shadow-xs space-y-3">
                                    <div class="flex justify-between items-center">
                                        <div>
                                            <h4 class="font-bold text-slate-800 text-sm">${c.name}</h4>
                                            <p class="text-xs text-slate-500">NISN: ${c.nisn} | Jenjang: ${c.level}</p>
                                        </div>
                                        <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">Siswa Aktif</span>
                                    </div>

                                    <div class="pt-2 border-t border-slate-100">
                                        <p class="text-xs font-bold text-slate-700 mb-2">Riwayat Nilai Latihan Kuis:</p>
                                        <div class="space-y-1.5">
                                            ${attempts.length ? attempts.map(a => {
                                                const qz = state.quizzes.find(q => q.id === a.quizId);
                                                return `
                                                    <div class="p-2.5 bg-slate-50 rounded-xl flex justify-between items-center text-xs">
                                                        <span>${qz ? qz.title : 'Kuis'} (${a.date})</span>
                                                        <span class="font-mono font-bold text-indigo-700">Skor: ${a.score}/100</span>
                                                    </div>
                                                `;
                                            }).join('') : `<p class="text-xs text-slate-400 italic">Belum ada nilai kuis tersimpan.</p>`}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderParentInvoicesView() {
            const currentParent = state.parents.find(p => p.name.toLowerCase().includes(state.currentUser.name.toLowerCase())) || state.parents[0];
            const myChildrenIds = state.students.filter(s => s.parentId === currentParent?.id).map(s => s.id);
            const myInvoices = state.invoices.filter(i => myChildrenIds.includes(i.studentId));

            return `
                <div class="space-y-4">
                    <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-xs text-emerald-900">
                        <p class="font-bold">Tagihan & Pembayaran SPP Anak (Orang Tua)</p>
                        <p class="text-[11px] text-emerald-700">Unduh kuitansi resmi atau kirim konfirmasi tagihan via WhatsApp ke Bimbel.</p>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-x-auto">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 border-b border-slate-200">
                                    <th class="p-3.5 font-semibold">No Invoice</th>
                                    <th class="p-3.5 font-semibold">Anak (Siswa)</th>
                                    <th class="p-3.5 font-semibold">Bulan</th>
                                    <th class="p-3.5 font-semibold">Nominal SPP</th>
                                    <th class="p-3.5 font-semibold">Status</th>
                                    <th class="p-3.5 font-semibold text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${myInvoices.map(inv => {
                                    const child = state.students.find(s => s.id === inv.studentId);
                                    return `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-3.5 font-mono font-bold text-slate-800">${inv.invoiceNo}</td>
                                            <td class="p-3.5 font-semibold text-slate-800">${child ? child.name : '-'}</td>
                                            <td class="p-3.5">${inv.month}</td>
                                            <td class="p-3.5 font-mono font-bold text-slate-800">Rp ${inv.amount.toLocaleString('id-ID')}</td>
                                            <td class="p-3.5">
                                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${inv.status === 'Lunas' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                                    ${inv.status}
                                                </span>
                                            </td>
                                            <td class="p-3.5 text-right space-x-1">
                                                ${inv.status === 'Lunas' ? `
                                                    <button onclick="printReceipt('${inv.id}')" class="px-2.5 py-1 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg text-[11px] font-semibold">🖨️ Cetak Kuitansi</button>
                                                ` : ''}
                                                <button onclick="sendWAInvoice('${inv.id}')" class="px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-[11px] font-semibold">📲 WA Bimbel</button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function openModal(contentHtml) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = contentHtml;
            container.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
            lucide.createIcons();
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                container.classList.add('hidden');
            }, 200);
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
