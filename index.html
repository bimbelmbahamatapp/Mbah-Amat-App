        // --- STREAMING_CHUNK:Initializing Device Frame Preview Switcher ---
        function setDeviceFrame(device) {
            const frame = document.getElementById('device-frame');
            ['pc', 'tablet', 'iphone', 'android'].forEach(d => {
                document.getElementById(`btn-${d}`).className = "px-3 py-1 rounded text-xs font-semibold text-indigo-300 hover:text-white transition";
            });
            document.getElementById(`btn-${device}`).className = "px-3 py-1 rounded text-xs font-semibold bg-indigo-600 text-white transition shadow";

            frame.className = "flex flex-col bg-white shadow-2xl transition-all duration-300 overflow-hidden ";
            if (device === 'pc') {
                frame.style.width = "100%";
                frame.style.height = "100%";
                frame.style.borderRadius = "0px";
                frame.style.border = "none";
            } else if (device === 'tablet') {
                frame.style.width = "768px";
                frame.style.height = "90vh";
                frame.style.borderRadius = "24px";
                frame.style.border = "8px solid #334155";
            } else if (device === 'iphone') {
                frame.style.width = "390px";
                frame.style.height = "844px";
                frame.style.borderRadius = "40px";
                frame.style.border = "10px solid #1e293b";
            } else if (device === 'android') {
                frame.style.width = "412px";
                frame.style.height = "890px";
                frame.style.borderRadius = "28px";
                frame.style.border = "8px solid #0f172a";
            }
        }

        // --- STREAMING_CHUNK:Notification & Toast Helper ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-600' : 'bg-amber-600');
            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm font-medium animate-in slide-in-from-bottom-5 duration-300 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();

            if (u === 'arifnoker' && p === 'arieph123') {
                DB.currentUser = { username: 'arifnoker', role: 'admin', name: 'Arif Noker (Super Admin)' };
                showToast('Login Berhasil sebagai Super Admin!');
                renderMainDashboard();
                return;
            }

            // Check accounts array
            const acc = DB.accounts.find(x => x.username === u);
            if (acc) {
                DB.currentUser = { username: acc.username, role: acc.role, name: acc.name };
                showToast(`Login Berhasil sebagai ${acc.role.toUpperCase()}!`);
                renderMainDashboard();
                return;
            }

            // Check registrations
            const reg = DB.registrations.find(x => x.username === u && x.password === p);
            if (reg) {
                if(reg.status !== 'Disetujui') {
                    showToast('Pendaftaran Anda masih Pending/Menunggu Validasi Admin.', 'warning');
                    return;
                }
                DB.currentUser = { username: reg.username, role: 'siswa', name: reg.fullName };
                showToast('Login Berhasil!');
                renderMainDashboard();
                return;
            }

            showToast('Username atau Password Salah!', 'error');
        }

            // Simulate WhatsApp Notification
            showToast(`[SIMULASI WA] Pesan terkirim ke ${phone}: Pendaftaran Anda berhasil diproses.`, 'success');
            renderAuthScreen();
        }

        function calculateSppPreview() {
            const studentVal = document.getElementById('calc-student').value.split('|');
            const base = Number(studentVal[1]);
            const izinCount = Number(document.getElementById('calc-izin').value);
            const disc = izinCount * 25000;
            const total = Math.max(0, base - disc);

            document.getElementById('prev-base').innerText = `Rp ${base.toLocaleString()}`;
            document.getElementById('prev-disc').innerText = `-Rp ${disc.toLocaleString()}`;
            document.getElementById('prev-total').innerText = `Rp ${total.toLocaleString()}`;
        }

        function generateCalculatedInvoice() {
            const studentVal = document.getElementById('calc-student').value.split('|');

            const base = Number(studentVal[1]);
            const izinCount = Number(document.getElementById('calc-izin').value);
            const disc = izinCount * 25000;
            const total = Math.max(0, base - disc);

            DB.invoices.push({
                invoiceNo: `INV-2026-06-00${DB.invoices.length + 1}`,
                date: '2026-06-01',
                month: 'Juni 2026',
                studentName: name,
                baseAmount: base,
                discount: disc,
                total: total,
                deadline: '2026-06-20',
                status: 'Belum Lunas',
                waSent: false
            });

            showToast('Invoice baru berhasil diterbitkan otomatis!');
