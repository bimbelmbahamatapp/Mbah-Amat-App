        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            const bgClass = type === "success" ? "bg-emerald-600 text-white" : type === "error" ? "bg-rose-600 text-white" : "bg-indigo-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 transition transform translate-y-2 opacity-0 duration-300 font-medium text-sm`;
            toast.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':type==='error'?'fa-circle-exclamation':'fa-circle-info'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove("translate-y-2", "opacity-0"), 10);
            setTimeout(() => {
                toast.classList.add("translate-y-2", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        let isRegisterMode = false;
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById("auth-form-title");
            const subtitle = document.getElementById("auth-form-subtitle");
            const btnToggle = document.getElementById("toggle-auth-mode");
            const btnSubmit = document.getElementById("auth-submit-btn");
            const regFields = document.getElementById("register-fields");

            if (isRegisterMode) {
                title.innerText = "Pendaftaran Akun Baru";
                subtitle.innerText = "Buat akun baru untuk mengakses portal bimbel.";
                btnToggle.innerText = "Sudah punya akun? Masuk";
                btnSubmit.innerText = "Daftar Sekarang";
                regFields.classList.remove("hidden");
            } else {
                title.innerText = "Masuk Akun";
                subtitle.innerText = "Pilih role demo instan atau masukkan kredensial Anda.";
                btnToggle.innerText = "Daftar Akun";
                btnSubmit.innerText = "Masuk ke Dashboard";
                regFields.classList.add("hidden");
            }
        }

        function quickLogin(username) {
            const user = appState.users.find(u => u.username === username);
            if (user) {
                appState.currentUser = user;
                saveState();
                showToast(`Berhasil masuk sebagai ${user.name} (${user.role})!`, "success");
                render();
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById("auth-username").value.trim();
            const password = document.getElementById("auth-password").value.trim();

            if (isRegisterMode) {
                const name = document.getElementById("reg-name").value.trim();
                const role = document.getElementById("reg-role").value;
                if (!name) {
                    showToast("Nama lengkap wajib diisi!", "error");
                    return;
                }
                const existing = appState.users.find(u => u.username === username);
                if (existing) {
                    showToast("Username sudah terdaftar! Gunakan yang lain.", "error");
                    return;
                }
                const newUser = { id: Date.now(), name, username, password, role, email: `${username}@mbhamat.com`, phone: "08123456789", status: "Aktif" };
                appState.users.push(newUser);

                // Auto add to corresponding master entity
                if (role === "Siswa") {
                    appState.students.push({ id: Date.now(), name, nisn: "008" + Math.floor(Math.random()*1000000), grade: "SMA/MA/SMK", address: "Yogyakarta", phone: "08123456789", parentContact: "Orang Tua", status: "Aktif" });
                } else if (role === "Tentor") {
                    appState.tutors.push({ id: Date.now(), name, subject: "Umum", phone: "08123456789", email: newUser.email, employment: "Paruh Waktu", bank: "BCA" });
                }
                saveState();
                appState.currentUser = newUser;
                showToast("Registrasi berhasil dan otomatis masuk!", "success");
                render();
            } else {
                const user = appState.users.find(u => u.username === username && u.password === password);
                if (user) {
                    appState.currentUser = user;
                    saveState();
                    showToast(`Selamat datang kembali, ${user.name}!`, "success");
                    render();
                } else {
                    showToast("Username atau password salah!", "error");
                }
            }
        }

        function logout() {
            appState.currentUser = null;
            saveState();
            showToast("Anda telah keluar sesi.", "info");
            render();
        }

        function calcTutorFee(e) {

            const grade = document.getElementById("m-tfee-grade").value;

            // Find matching matrix
            const rule = appState.feeMatrix.find(m => m.grade === grade) || { baseFee: 50000, multiplier: 8000 };

            closeModal();
            showToast(`Fee kalkulasi berhasil: Rp ${totalFee.toLocaleString('id-ID')}`, "success");
            render();

        function payInvoice(invNo) {
            const inv = appState.invoices.find(i => i.invNo === invNo);
            if (inv && inv.status === 'Belum Lunas') {
                inv.status = 'Lunas';
                appState.payments.push({
                    id: Date.now(),
                    invNo: inv.invNo,
                    date: new Date().toISOString().split('T')[0],
                    studentName: inv.studentName,
                    amount: inv.amount,
                    method: "Transfer Bank BCA",
                    receiptNo: `RCP-${Math.floor(10000 + Math.random() * 90000)}`

        let uploadedFileBase64 = null;
        function handleAiFile(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById("ai-file-name").innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedFileBase64 = e.target.result.split(',')[1];
                };
                reader.readAsDataURL(file);
            }
        }

        async function generateAiSoal() {
            const promptText = document.getElementById("ai-prompt").value.trim();
            if (!promptText) {
                showToast("Masukkan prompt topik soal terlebih dahulu!", "error");
                return;
            }

            const btn = document.getElementById("ai-btn");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Sedang Memproses AI...</span>`;

            const systemPrompt = "Act as an expert educational AI. Generate structured quiz questions in strict JSON format matching: {\"title\": \"string\", \"subject\": \"string\", \"grade\": \"string\", \"questions\": [{\"q\": \"string\", \"options\": [\"string\"], \"answer\": number, \"discussion\": \"string\"}]}.";

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: promptText + " Return strictly valid JSON." },
                            ...(uploadedFileBase64 ? [{ inlineData: { mimeType: "image/png", data: uploadedFileBase64 } }] : [])
                        ]
                    }
                ],
                generationConfig: {
                    responseMimeType: "application/json"
                },
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                let response = null;
                let retries = 3;
                let delay = 1000;

                for (let i = 0; i < retries; i++) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) break;
                    } catch (err) {
                        if (i === retries - 1) throw err;
                    }
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const jsonText = candidate.content.parts[0].text;
                    const parsedQuiz = JSON.parse(jsonText);

                    // Push into quizzes bank
                    const newQuiz = {
                        id: Date.now(),
                        title: parsedQuiz.title || "Kuis Gemini AI",
                        subject: parsedQuiz.subject || "Fisika / Umum",
                        grade: parsedQuiz.grade || "SMA/MA/SMK",
                        questions: parsedQuiz.questions || [],
                        results: []
                    };
                    appState.quizzes.push(newQuiz);
                    saveState();

                    // Render output preview
                    const resContainer = document.getElementById("ai-result-container");
                    const outCard = document.getElementById("ai-output-card");
                    resContainer.classList.remove("hidden");
                    outCard.innerHTML = `
                        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                            <div>
                                <h4 class="font-bold text-lg text-slate-800">${newQuiz.title}</h4>
                                <span class="text-xs text-indigo-600 font-semibold">${newQuiz.subject} • ${newQuiz.grade}</span>
                            </div>
                            <button onclick="switchModule('quizzes')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow transition">
                                <i class="fa-solid fa-brain"></i><span>Lihat di Bank Ujian</span>
                            </button>
                        </div>
                        <div class="space-y-4 pt-2">
                            ${newQuiz.questions.map((q, idx) => `
                                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100 space-y-2">
                                    <div class="font-semibold text-sm text-slate-800">${idx + 1}. ${q.q}</div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pl-4">
                                        ${q.options.map((opt, i) => `
                                            <div class="text-xs text-slate-600 p-2 rounded-lg ${i === q.answer ? 'bg-emerald-50 text-emerald-700 font-bold border border-emerald-200' : 'bg-white border border-slate-200'}">
                                                ${String.fromCharCode(65 + i)}. ${opt} ${i === q.answer ? '✓ (Kunci)' : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="text-xs text-slate-500 italic mt-1">Pembahasan: ${q.discussion}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    showToast("Soal berhasil digenerate oleh Gemini AI dan disimpan ke Bank Kuis!", "success");
                } else {
                    throw new Error("Struktur respons AI tidak valid.");
                }
            } catch (error) {
                console.error(error);
                showToast("Gagal generate soal dengan AI. Coba lagi.", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i><span>Generate with Gemini AI</span>`;
            }
        }

                    <div class="text-center py-6 bg-gradient-to-tr from-indigo-50 to-emerald-50 rounded-3xl border border-indigo-100 mb-6">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Skor Akhir Anda</div>
                        <div class="text-5xl font-extrabold text-indigo-600">${Math.round(score)} <span class="text-lg text-slate-400">/ 100</span></div>
                    </div>

                    <div class="space-y-4">
                        ${qz.questions.map((item, qIdx) => {
                            const userAns = answers[qIdx];
                            const isCorrect = userAns !== undefined && parseInt(userAns) === item.answer;
                            return `
                                <div class="p-5 rounded-2xl ${isCorrect ? 'bg-emerald-50/60 border border-emerald-200' : 'bg-rose-50/60 border border-rose-200'} space-y-2">
                                    <div class="font-semibold text-sm text-slate-800">${qIdx + 1}. ${item.q}</div>
                                    <div class="text-xs font-medium ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                                        Jawaban Anda: ${userAns !== undefined ? item.options[userAns] : 'Tidak dijawab'} ${isCorrect ? '✓ Benar' : '✗ Salah'}
                                    </div>
                                    <div class="text-xs text-slate-600 font-medium">Kunci Jawaban: <strong class="text-emerald-600">${item.options[item.answer]}</strong></div>
                                    <div class="text-xs text-slate-500 italic mt-1 bg-white/80 p-3 rounded-xl border border-slate-100">Pembahasan: ${item.discussion}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="flex justify-end pt-6 border-t border-slate-100 mt-6">
                        <button type="button" onclick="closeModal()" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/30">Tutup Ujian</button>
                    </div>
                </div>
            `;
            showToast(`Ujian selesai! Skor Anda: ${Math.round(score)}`, "success");
        }

        function closeModal() {
            const modal = document.getElementById("global-modal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        function filterTable(tableId, query) {
            const table = document.getElementById(tableId);
            if (!table) return;
            const trs = table.getElementsByTagName("tr");
            for (let i = 1; i < trs.length; i++) {
                let match = false;
                const tds = trs[i].getElementsByTagName("td");
                for (let j = 0; j < tds.length; j++) {
                    if (tds[j].innerText.toLowerCase().includes(query.toLowerCase())) {
                        match = true;
                        break;
                    }
                }
                trs[i].style.display = match ? "" : "none";
            }
        }

        function attachAuthEvents() {}
        function attachDashboardEvents() {}

        // Initialize App on Load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
